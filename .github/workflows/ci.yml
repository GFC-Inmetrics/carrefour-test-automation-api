name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1 - Checkout do código
      - name: Checkout code
        uses: actions/checkout@v3

      # 2 - ️ Configura JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3 - Mostra a estrutura inicial (debug)
      - name: Show project structure
        run: ls -R

      # 4 - Lista features para garantir que o Cucumber vai encontrá-las
      - name: List feature files
        run: ls -R src/test/resources/features

      - name: Build and run tests
        run: mvn clean test


      # 5 - Roda Maven em modo verbose
      - name: Run Maven tests
        run: mvn clean test -X

      # 6 - Lista o target para ver quais relatórios foram criados
      - name: List target folder
        run: ls -R target

      # 7 - Faz upload dos relatórios do Cucumber, se existirem
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports
          path: |
            target/cucumber-report/html
            target/cucumber-report.json
            target/cucumber.xml

      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
      
